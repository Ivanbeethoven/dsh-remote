# dsh-ssh-bridge bundle layer.
#
# Installing this package as a profile bundle inserts the row below but leaves the
# bridge off, so dropping the plugin into a profile cannot start an outbound SSH
# connection before you have named a server.
#
# Enable and configure it in your own patch layer (for example
# ~/.dsh/profiles/desktop/cordis.patch.yml):
#
#   - id: ssh-bridge
#     config:
#       enabled: true
#       ssh:
#         host: relay.example.com
#         port: 22
#         username: dsh
#       forward:
#         bindAddress: 127.0.0.1
#         port: 9100
- insert:
    - id: ssh-bridge
      name: dsh-ssh-bridge
      config:
        enabled: false
